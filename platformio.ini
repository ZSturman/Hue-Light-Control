; Hue Light Control
; ESP32 + rotary encoder + SSD1306 OLED controller for a Philips Hue room.
; See README.md for wiring, .env setup and troubleshooting.

[platformio]
description = Physical Hue room controller with on-device diagnostics

[env:esp32dev]
; Pinned to the version this firmware was built and tested with
; (Arduino core 2.0.17). A newer major version moves to core 3.x,
; which renames some Wi-Fi/mDNS APIs.
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

extra_scripts = pre:load_env.py

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.0
    adafruit/Adafruit SSD1306 @ ^2.5.0
